<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>画像中央配置ツール（リアルタイム対応）</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #fff8fc;
      padding: 20px;
      color: #333;
    }

    h2 {
      color: #e75480;
      font-size: 26px;
      text-align: center;
    }

    input, button {
      padding: 10px;
      margin: 6px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    #previewArea {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .previewCard {
      background-color: white;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    .previewCard img {
      max-width: 100%;
      border-radius: 10px;
    }

    .previewCard a {
      display: inline-block;
      margin-top: 8px;
      text-decoration: none;
      color: #e75480;
      font-weight: bold;
    }

    label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🎨 画像を中央配置してリサイズ（リアルタイム変換）</h2>

  <div style="text-align:center;">
    <label>画像を選んでね：</label><br>
    <input type="file" id="imageInput" multiple accept="image/*"><br>

    <label>出力サイズ（px）：</label><br>
    幅：<input type="number" id="targetWidth" value="1280" oninput="refreshImages()">　
    高さ：<input type="number" id="targetHeight" value="720" oninput="refreshImages()"><br>

    <label>最大ファイルサイズ（KB）：</label><br>
    <input type="number" id="maxSizeKB" value="300" oninput="refreshImages()"><br>
  </div>

  <div id="previewArea"></div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let currentFiles = [];

    document.getElementById("imageInput").addEventListener("change", () => {
      currentFiles = Array.from(document.getElementById("imageInput").files);
      refreshImages();
    });

    function sanitizeFileName(name, width, height) {
      let base = name.replace(/\.[^/.]+$/, "");
      base = base.replace(/_\d{2,5}[-xX]\d{2,5}/g, "");
      return `${base}_${width}-${height}.jpg`;
    }

    function refreshImages() {
      const width = parseInt(document.getElementById("targetWidth").value);
      const height = parseInt(document.getElementById("targetHeight").value);
      const maxSizeKB = parseInt(document.getElementById("maxSizeKB").value);
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const previewArea = document.getElementById("previewArea");
      previewArea.innerHTML = "";

      currentFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);

            const imgAspect = img.width / img.height;
            const targetAspect = width / height;
            let drawWidth, drawHeight;

            if (imgAspect > targetAspect) {
              drawWidth = width;
              drawHeight = width / imgAspect;
            } else {
              drawHeight = height;
              drawWidth = height * imgAspect;
            }

            const offsetX = (width - drawWidth) / 2;
            const offsetY = (height - drawHeight) / 2;
            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

            function exportBlob(quality, callback) {
              canvas.toBlob(blob => {
                if (!blob) return;
                if (blob.size / 1024 > maxSizeKB && quality > 0.1) {
                  exportBlob(quality - 0.05, callback);
                } else {
                  callback(blob);
                }
              }, "image/jpeg", quality);
            }

            exportBlob(0.9, blob => {
              const newName = sanitizeFileName(file.name, width, height);
              const link = document.createElement("a");
              link.href = URL.createObjectURL(blob);
              link.download = newName;
              link.textContent = `⬇ ${newName}`;

              const card = document.createElement("div");
              card.className = "previewCard";

              const imgPreview = document.createElement("img");
              imgPreview.src = link.href;

              card.appendChild(imgPreview);
              card.appendChild(link);
              previewArea.appendChild(card);
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
