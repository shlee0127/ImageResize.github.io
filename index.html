<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>画像中央配置ツール（全再変換＋ZIP）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #fff8fc;
      text-align: center;
      padding: 20px;
    }

    h2 {
      color: #e75480;
    }

    input, button {
      padding: 10px;
      margin: 6px;
      font-size: 16px;
      border-radius: 10px;
    }

    button {
      background-color: #e75480;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #d14370;
    }

    img {
      max-width: 300px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h2>🎨 画像を中央配置して変換（ZIP出力）</h2>

  <input type="file" id="imageInput" multiple accept="image/*"><br>
  幅：<input type="number" id="targetWidth" value="1080" oninput="updateAll()">
  高さ：<input type="number" id="targetHeight" value="1920" oninput="updateAll()"><br>
  最大サイズ（KB）：<input type="number" id="maxSizeKB" value="300"><br>

  <button onclick="downloadZip()">ZIPで一括ダウンロード</button>

  <br><img id="previewImage" style="display:none;">
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let processedImages = new Map();
    let originalFiles = [];
    let previewImage = document.getElementById("previewImage");

    document.getElementById("imageInput").addEventListener("change", () => {
      previewImage.style.display = "none";
      processedImages.clear();

      const files = Array.from(document.getElementById("imageInput").files);
      if (files.length === 0) return;

      originalFiles = files;
      processAllFiles();
    });

    function updateAll() {
      if (originalFiles.length > 0) {
        processAllFiles();
      }
    }

    function processAllFiles() {
      processedImages.clear();
      originalFiles.forEach((file, index) => {
        processFile(file, index === 0);
      });
    }

    function processFile(file, isPreview) {
      const width = parseInt(document.getElementById("targetWidth").value);
      const height = parseInt(document.getElementById("targetHeight").value);
      const maxSizeKB = parseInt(document.getElementById("maxSizeKB").value);
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          canvas.width = width;
          canvas.height = height;
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, width, height);

          const imgAspect = img.width / img.height;
          const targetAspect = width / height;
          let drawWidth, drawHeight;

          if (imgAspect > targetAspect) {
            drawWidth = width;
            drawHeight = width / imgAspect;
          } else {
            drawHeight = height;
            drawWidth = height * imgAspect;
          }

          const offsetX = (width - drawWidth) / 2;
          const offsetY = (height - drawHeight) / 2;
          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

          function exportBlob(quality, callback) {
            canvas.toBlob(blob => {
              if (!blob) return;
              if (blob.size / 1024 > maxSizeKB && quality > 0.1) {
                exportBlob(quality - 0.05, callback);
              } else {
                callback(blob);
              }
            }, "image/jpeg", quality);
          }

          exportBlob(0.9, blob => {
            const baseName = file.name.replace(/\.[^/.]+$/, "").replace(/_\d{2,5}[-xX]\d{2,5}/g, "");
            const fileName = `${baseName}_${width}-${height}.jpg`;
            processedImages.set(file.name, { name: fileName, blob });

            if (isPreview) {
              const url = URL.createObjectURL(blob);
              previewImage.src = url;
              previewImage.style.display = "inline";
            }
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadZip() {
      if (processedImages.size === 0) {
        alert("先に画像を選んでください！");
        return;
      }

      const zip = new JSZip();
      for (let data of processedImages.values()) {
        zip.file(data.name, data.blob);
      }

      zip.generateAsync({ type: "blob" }).then(content => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = "resized_images.zip";
        link.click();
      });
    }
  </script>
</body>
</html>
